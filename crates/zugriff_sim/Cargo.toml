[package]
name = "zugriff_sim"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "ZUGRIFF's authoritative game simulation: brush world, movement, weapons, rules, nav and bots. No rendering."

[dependencies]
glam = { workspace = true }
serde.workspace = true
serde_json.workspace = true
# Online play (net.rs): compact binary messages, the same natively and in wasm.
postcard = { version = "1", default-features = false, features = ["alloc"] }
