name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test simulation and server
        run: cargo test --locked -p zugriff_sim -p zugriff_server
      - name: Package desktop game and server
        run: python packaging/package.py
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: python packaging/appimage.py
      - name: Test Linux AppImage
        if: runner.os == 'Linux'
        run: dist/zugriff-linux-x86_64.AppImage --appimage-extract-and-run --version
      - name: Test relocated bundle
        run: python scripts/smoke-bundle.py dist/zugriff-${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: zugriff-${{ matrix.platform }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
  publish:
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zugriff-*
          path: dist
          merge-multiple: true
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.AppImage dist/*.tar.gz dist/*.zip dist/*.dmg dist/*.sha256)
          if (( ${#files[@]} == 0 )); then
            echo 'No platform packages passed. See the build jobs.' >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "ZUGRIFF ${GITHUB_REF_NAME#v}" --generate-notes "${files[@]}"
          fi
