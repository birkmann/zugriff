name: Diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostics.yml', '.github/scripts/diagnose.py']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Collect failed-job logs and Pages status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/diagnose.py
      - name: Save report in private repository
        run: |
          cd diagnostics
          git init -b ci-status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Update build and deployment diagnostics'
          git -c "http.https://github.com/.extraheader=$(git -C .. config --get http.https://github.com/.extraheader)" push --force "https://github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/ci-status
