[package]
name = "zg_tex"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "ZUGRIFF texture compiler: PNG/JPEG → KTX2 (BC7 / BC5, full mip chain, zstd), loaded by Bevy without transcoding."

[[bin]]
name = "zg-tex"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
intel_tex_2 = "0.5"
zstd = "0.13"
