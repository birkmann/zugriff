<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ZUGRIFF's app icon: the menu's emblem (an amber diamond round a solid one) on a dark tile. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a33"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb000" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd24d"/>
      <stop offset="1" stop-color="#ff9500"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#tile)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="102.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <circle cx="256" cy="256" r="190" fill="url(#warm)"/>
  <g filter="url(#glow)" transform="rotate(45 256 256)">
    <rect x="151" y="151" width="210" height="210" rx="14" fill="none" stroke="url(#amber)" stroke-width="30"/>
    <rect x="220" y="220" width="72" height="72" rx="6" fill="url(#amber)"/>
  </g>
  <!-- sight ticks -->
  <g stroke="#ffb000" stroke-opacity="0.55" stroke-width="12" stroke-linecap="round">
    <line x1="256" y1="58" x2="256" y2="84"/>
    <line x1="256" y1="428" x2="256" y2="454"/>
    <line x1="58" y1="256" x2="84" y2="256"/>
    <line x1="428" y1="256" x2="454" y2="256"/>
  </g>
</svg>
